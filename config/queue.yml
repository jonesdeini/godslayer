default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "default"
      threads: 1
      processes: 1
      polling_interval: 1
    - queues: "sweep"
      threads: 2
      processes: <%= ENV.fetch("SWEEP_JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: "enqueuing"
      threads: 1
      processes: 1
      polling_interval: 1
    - queues: "image_downloads"
      threads: 2
      processes: 1
      polling_interval: 1
    - queues: "publishing"
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
