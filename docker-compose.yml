services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: godslayer
      POSTGRES_DB: godslayer_production
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-queue-db.sh:/docker-entrypoint-initdb.d/init-queue-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godslayer -d godslayer_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "100.92.93.12:15672:15672"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama

  # One-shot: waits for ollama's API, pulls the model the ml consumer
  # expects, then exits. Without this, a fresh ollama container has no
  # models loaded and every determination would fail until someone pulled
  # one by hand - ml would crash-loop (via restart: unless-stopped) until
  # that happened, since a missing model isn't caught anywhere and the
  # message is never acked, so RabbitMQ keeps redelivering it.
  ollama-init:
    image: ollama/ollama
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: [ "sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull granite4.2:8b" ]

  web:
    image: ghcr.io/jonesdeini/godslayer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./storage_data:/rails/storage
    environment: &app_env
      PGHOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID}
      EBAY_ENVIRONMENT: ${EBAY_ENVIRONMENT}
      PRICE_CAP_CENTS: ${PRICE_CAP_CENTS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  jobs:
    image: ghcr.io/jonesdeini/godslayer:latest
    restart: unless-stopped
    command: bin/jobs
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./storage_data:/rails/storage
    environment: *app_env

  ml:
    image: ghcr.io/jonesdeini/godslayer-ml:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      GODSLAYER_API_URL: http://web:3000
      OLLAMA_URL: http://ollama:11434

  # Poll-based deploy: no inbound access to this box needed, GitHub never
  # executes anything here, it just gets pulled from. See reef-1000's
  # CLAUDE.md ("Deploying") for the full reasoning this mirrors.
  updater:
    image: docker:cli
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: godslayer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Confirmed against a real checkout on Shadesmar, matching
      # reef-1000's real /mnt/user/reefff/reef-1000 convention.
      - /mnt/user/godslayerrr/godslayer:/mnt/user/godslayerrr/godslayer
    working_dir: /mnt/user/godslayerrr/godslayer
    entrypoint: sh
    # ollama isn't pulled automatically - it's not our image and doesn't
    # need frequent updates, just `docker compose pull ollama` once by hand.
    command: -c 'while true; do docker compose pull --quiet web jobs ml postgres rabbitmq && docker compose up -d web jobs ml ollama postgres rabbitmq && docker image prune -f; sleep 300; done'
