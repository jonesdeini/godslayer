[project]
name = "godslayer-ml"
version = "0.1.0"
description = "Consumes listing_ready off RabbitMQ and processes eBay listings for godslayer"
readme = "README.md"
authors = [
    { name = "jonesdeini", email = "jonesdeini@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "pika>=1.4.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
godslayer-ml = "godslayer_ml:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
