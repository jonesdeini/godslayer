[project]
name = "godslayer-ml"
version = "0.1.0"
description = "Consumes listing_ready off RabbitMQ and processes eBay listings for godslayer"
readme = "README.md"
authors = [
    { name = "jonesdeini", email = "jonesdeini@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "pika>=1.4.4",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentry-sdk>=2.73.0",
    "tenacity>=9.2.1",
]

[project.scripts]
godslayer-ml = "godslayer_ml:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# Training-only - consumer.py never imports these, and they'd otherwise bloat
# the deployed image for nothing (Shadesmar's Docker has a fixed 20GB disk).
# ml/Dockerfile's `uv sync --locked --no-dev` never requests this group, so
# it stays out of production without needing any Dockerfile change.
training = [
    "pandas>=2.3",
    "scikit-learn>=1.8",
]

[tool.pytest.ini_options]
# Lets tests import ml/training/ as a plain sibling package (it's dev-only
# tooling, not part of the installed godslayer_ml package, so it isn't on
# sys.path any other way).
pythonpath = ["."]

[tool.ruff]
# Matches this repo's Ruby side: rubocop-rails-omakase enforces no max
# line length, and the existing Python here was already written long-
# line in that same spirit - 120 avoids ruff format fighting a house
# style that already exists, without going fully unbounded.
line-length = 120
